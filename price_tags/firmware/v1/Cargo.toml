[package]
name = "agnostic_mmc"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "esp32s3_http_server"
path = "src/bin/esp32s3_http_server.rs"
required-features = ["esp32s3"]

[dependencies]
defmt = "1.2.0"
embedded-sdmmc = "0.10.0"
exfat-slim = { version = "0.7.0", default-features = false, features = [
  "defmt",
  "embassy",
] }
aligned = "0.4.3"
mbr-nostd = "0.1.0"
embedded-hal = "1.0.0"
critical-section = { version = "1.2.0", optional = true }
embedded-hal-bus = { version = "0.3.0", optional = true }

[target.'cfg(all(target_os = "none", any(target_arch = "xtensa", target_arch = "riscv32")))'.dependencies]
embedded-io-async = { version = "0.7.0", optional = true }
esp-backtrace = { version = "0.19.0", optional = true, features = [
  "panic-handler",
  "println",
] }
esp-println = { version = "0.17.0", optional = true, features = [
  "defmt-espflash",
] }
esp-metadata-generated = { version = "0.4.0", optional = true }
esp-bootloader-esp-idf = { version = "0.5.0", optional = true }
esp-storage = { version = "0.9.0", optional = true }
embassy-time = { version = "0.5.0", optional = true }
static_cell = { version = "2.1.1", optional = true }
embassy-executor = { version = "0.10.0", optional = true }
edge-http = { version = "0.8.0", optional = true }
edge-dhcp = { version = "0.8.0", optional = true }
edge-nal = { version = "0.7.0", optional = true }
edge-nal-embassy = { version = "0.9.0", optional = true }
embassy-net = { version = "0.9.0", optional = true, features = [
  "dhcpv4",
  "medium-ethernet",
  "tcp",
  "udp",
] }

esp-hal = { version = "1.1.1", optional = true, features = [
  "defmt",
  "unstable",
] }

esp-radio = { version = "0.18.0", optional = true, features = [
  "wifi",
  "defmt",
  "unstable",
] }

esp-alloc = { version = "0.10.0", features = ["defmt"], optional = true }

esp-rtos = { version = "0.3.0", optional = true, features = [
  "embassy",
  "defmt",
  "esp-radio",
] }

esp-sync = { version = "0.2.1", optional = true, features = ["defmt"] }

[profile.dev]
opt-level = 2

[features]
default = []
esp = [

  "dep:esp-alloc",
  "dep:esp-rtos",
  "dep:esp-hal",
  "dep:esp-radio",
  "dep:embassy-time",
  "dep:static_cell",
  "dep:embassy-executor",
  "dep:edge-http",
  "dep:edge-dhcp",
  "dep:edge-nal",
  "dep:edge-nal-embassy",
  "dep:embassy-net",
  "dep:embedded-io-async",

  "dep:esp-backtrace",
  "dep:esp-println",
  "dep:esp-metadata-generated",
  "dep:esp-bootloader-esp-idf",

  "dep:critical-section",
  "dep:embedded-hal-bus",
]
esp32 = [
  "esp",
  "esp-hal/esp32",
  "esp-radio/esp32",
  "esp-rtos/esp32",
  "esp-sync/esp32",
  "esp-alloc/esp32",
  "esp-backtrace/esp32",
  "esp-println/esp32",
  "esp-metadata-generated/esp32",
  "esp-bootloader-esp-idf/esp32",
  "esp-storage/esp32",
]
esp32c2 = [
  "esp",
  "esp-hal/esp32c2",
  "esp-radio/esp32c2",
  "esp-rtos/esp32c2",
  "esp-sync/esp32c2",
  "esp-alloc/esp32c2",
  "esp-backtrace/esp32c2",
  "esp-println/esp32c2",
  "esp-metadata-generated/esp32c2",
  "esp-bootloader-esp-idf/esp32c2",
  "esp-storage/esp32c2",
]
esp32c3 = [
  "esp",
  "esp-hal/esp32c3",
  "esp-radio/esp32c3",
  "esp-rtos/esp32c3",
  "esp-sync/esp32c3",
  "esp-alloc/esp32c3",
  "esp-backtrace/esp32c3",
  "esp-println/esp32c3",
  "esp-metadata-generated/esp32c3",
  "esp-bootloader-esp-idf/esp32c3",
  "esp-storage/esp32c3",
]
esp32c5 = [
  "esp",
  "esp-hal/esp32c5",
  "esp-radio/esp32c5",
  "esp-rtos/esp32c5",
  "esp-sync/esp32c5",
  "esp-alloc/esp32c5",
  "esp-backtrace/esp32c5",
  "esp-println/esp32c5",
  "esp-metadata-generated/esp32c5",
  "esp-bootloader-esp-idf/esp32c5",
  "esp-storage/esp32c5",
]
esp32c6 = [
  "esp",
  "esp-hal/esp32c6",
  "esp-radio/esp32c6",
  "esp-rtos/esp32c6",
  "esp-sync/esp32c6",
  "esp-alloc/esp32c6",
  "esp-backtrace/esp32c6",
  "esp-println/esp32c6",
  "esp-metadata-generated/esp32c6",
  "esp-bootloader-esp-idf/esp32c6",
  "esp-storage/esp32c6",
]
esp32c61 = [
  "esp",
  "esp-hal/esp32c61",
  "esp-radio/esp32c61",
  "esp-rtos/esp32c61",
  "esp-sync/esp32c61",
  "esp-alloc/esp32c61",
  "esp-backtrace/esp32c61",
  "esp-println/esp32c61",
  "esp-metadata-generated/esp32c61",
  "esp-bootloader-esp-idf/esp32c61",
  "esp-storage/esp32c61",
]
esp32s2 = [
  "esp",
  "esp-hal/esp32s2",
  "esp-radio/esp32s2",
  "esp-rtos/esp32s2",
  "esp-sync/esp32s2",
  "esp-alloc/esp32s2",
  "esp-backtrace/esp32s2",
  "esp-println/esp32s2",
  "esp-metadata-generated/esp32s2",
  "esp-bootloader-esp-idf/esp32s2",
  "esp-storage/esp32s2",
]
esp32s3 = [
  "esp",
  "esp-hal/esp32s3",
  "esp-radio/esp32s3",
  "esp-rtos/esp32s3",
  "esp-sync/esp32s3",
  "esp-alloc/esp32s3",
  "esp-backtrace/esp32s3",
  "esp-println/esp32s3",
  "esp-metadata-generated/esp32s3",
  "esp-bootloader-esp-idf/esp32s3",
  "esp-storage/esp32s3",
]
