[package]
name = "agnostic_mmc"
version = "0.1.0"
edition = "2024"

[dependencies]
embassy-time = "0.5.0"
static_cell = "2.1.1"
defmt = "1.2.0"
embedded-sdmmc = "0.10.0"
exfat-slim = { version = "0.7.0", default-features = false, features = [
  "defmt",
  "embassy",
] }
aligned = "0.4.3"
mbr-nostd = "0.1.0"
embedded-hal = "1.0.0"
embassy-executor = "0.10.0"

edge-http = "0.8.0"
edge-dhcp = "0.8.0"
edge-nal = "0.7.0"
edge-nal-embassy = { version = "0.9.0" }
embassy-net = { version = "0.9.0", features = [
  "dhcpv4",
  "medium-ethernet",
  "tcp",
  "udp",
] }

# platform specific optional feature
esp-hal = { version = "1.1.2", optional = true, features = [
  "defmt",
  "esp32s3",
  "unstable",
] }
esp-radio = { version = "0.18.0", optional = true, features = [
  "wifi",
  "defmt",
  "unstable",
  "esp32s3",
] }

[features]
default = []
esp = ["dep:esp-hal", "dep:esp-radio"]
