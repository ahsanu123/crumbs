[env]
DEFMT_LOG = "info"

[build]
target = "xtensa-esp32s3-none-elf"

[target.xtensa-esp32s3-none-elf]
runner = "espflash flash --monitor --chip esp32s3 --log-format defmt"
linker = "xtensa-esp32s3-elf-gcc"
rustflags = [
  "-C",
  "link-arg=-nostartfiles",
  "-C",
  "link-arg=-Tlinkall.x",
  "-C",
  "link-arg=-Tdefmt.x",
]

[unstable]
build-std = ["core", "alloc"]
