[package]
edition = "2024"
name = "stm32_sdmmc"
version = "0.1.0"
authors = ["Ahsanu Amala <caasperahsanuamala5@gmail.com>"]
resolver = "2"

[[bin]]
name = "stm32_sdmmc"
path = "./src/bin/main.rs"
test = false
bench = false

[dependencies]
defmt = "1.1"
defmt-rtt = "1.2"
panic-probe = { version = "1.0", features = ["print-defmt"] }

embedded-hal = "1.0.0"
embedded-hal-async = "1.0.0"
embedded-io = "0.7"
embedded-io-async = "0.7"
embedded-storage = "0.3.1"
cortex-m-rt = "0.7.5"

embassy-executor = { version = "0.10", features = [
  "platform-cortex-m",
  "executor-thread",
  "defmt",
  "executor-interrupt",
] }
embassy-sync = { version = "0.8" }
embassy-time = { version = "0.5", features = [
  "defmt",
  "defmt-timestamp-uptime",
] }

cortex-m = { version = "0.7.7", features = ["critical-section-single-core"] }
embassy-stm32 = { version = "0.6", features = [
  "defmt",
  "stm32f407vg",
  "unstable-pac",
  "memory-x",
  "time-driver-any",
] }

block-device-driver = "0.2.0"
sdio = { version = "0.5.1", features = [] }
exfat-slim = { version = "0.7.0", default-features = false, features = [
  "defmt",
  "embassy",
] }
mbr-nostd = "0.1.0"
aligned = "0.4.3"
embedded-alloc = { version = "0.7.0", features = [] }

[profile.release]
debug = 2
lto = true
opt-level = 'z'

[profile.dev]
debug = 2
lto = true
opt-level = "z"
