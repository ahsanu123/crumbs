[package]
authors = ["Ahsanu Amala <caasperahsanuamala5@gmail.com>"]
name = "kitchen_stm32"
edition = "2024"
version = "0.1.0"

[[bin]]
name = "main_usb_serial"
path = "./src/bin/main_usb_serial.rs"
test = false

[lib]
harness = false
test = false

[[test]]
name = "integration"
harness = false

[dependencies]
cortex-m = { version = "0.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7"
defmt = { version = "1.0", features = ["alloc"] }
defmt-semihosting = { version = "0.3.0", features = [
  "critical-section-single-core",
] }
embassy-embedded-hal = "0.6.0"
embassy-executor = { version = "0.10.0", features = [
  "platform-cortex-m",
  "executor-thread",
  "executor-interrupt",
  "defmt",
] }
embassy-stm32 = { version = "0.6.0", features = [
  "stm32f405rg",
  "memory-x",
  "time-driver-tim4",
] }
embassy-sync = "0.8.0"
embassy-time = "0.5.0"
embedded-alloc = { version = "0.7.0", features = ["llff"] }
embedded-hal = "1.0.0"
panic-probe = { version = "1.0", features = ["print-defmt"] }
semihosting = "0.1.20"
static_cell = "2.1.1"
defmt-rtt = "1.0.0"

[dev-dependencies]
defmt-test = "0.5"


# cargo build/run
[profile.dev]
# default is opt-level = '0', but that makes very
# verbose machine code
opt-level = 's'
# trade compile speed for slightly better optimisations
codegen-units = 1

# cargo build/run --release
[profile.release]
# default is opt-level = '3', but that makes quite
# verbose machine code
opt-level = 's'
# trade compile speed for slightly better optimisations
codegen-units = 1
# Use Link Time Optimisations to further inline things across
# crates
lto = 'fat'
# Leave the debug symbols in (default is no debug info)
debug = 2
